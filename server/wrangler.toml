name = "strafe-online"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[durable_objects.bindings]]
name = "RACE"
class_name = "Race"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board", "Race"]

# the game itself, built into public/ by the deploy workflow, so it can be
# played in any browser at the server's address
[assets]
directory = "./public"
