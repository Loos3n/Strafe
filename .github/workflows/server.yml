name: server
# Deploys the online board and race server (server/) to Cloudflare Workers.
# Needs the repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', 'src/**', 'assets/**', 'vendor/**', 'build.js', '.github/workflows/server.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check level data is current
        run: node gen-levels.cjs && git diff --exit-code src/levels.json src/sets.json
      - name: Build the game page the server hosts
        run: node ../build.js "" public/index.html
      - name: Make sure the account has a workers.dev address
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          api=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain
          have=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $api | jq -r '.result.subdomain // empty')
          for name in strafe-game strafe-online-game strafe-loos3n strafe-$RANDOM; do
            [ -n "$have" ] && break
            have=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' \
              -d "{\"subdomain\":\"$name\"}" $api | tee /dev/stderr | jq -r '.result.subdomain // empty')
          done
          echo "workers.dev subdomain: $have"
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: Test the live server
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          # a new workers.dev address can take a few minutes to get its certificate
          for i in $(seq 1 30); do curl -sf https://strafe-online.strafe-game.workers.dev/ && break; sleep 10; done
          # a deploy reaches every Cloudflare location over about a minute, and each
          # race room restarts when it does, dropping its sockets; let it settle first
          sleep 60
          node test/api.js https://strafe-online.strafe-game.workers.dev
